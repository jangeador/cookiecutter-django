{% raw %}{% load allauth %}
<span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold {% if 'success' in attrs.tags %}bg-emerald-100 text-emerald-800{% elif 'warning' in attrs.tags %}bg-amber-100 text-amber-800{% elif 'danger' in attrs.tags %}bg-red-100 text-red-800{% elif 'primary' in attrs.tags %}bg-indigo-100 text-indigo-800{% else %}bg-slate-100 text-slate-700{% endif %}">{% slot %}{% endslot %}</span>
{% endraw %}
