{% raw %}{% extends "base.html" %}
{% load i18n %}
{% block title %}
  {% translate "Edit profile" %}
{% endblock title %}
{% block content %}
  <section class="max-w-xl rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1>{% translate "Edit profile" %}</h1>
    <form method="post" action="{% url 'users:update' %}" class="space-y-6">
      {% csrf_token %}
      {% include "partials/form.html" %}
      <button type="submit"
              class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">{% translate "Update" %}</button>
    </form>
  </section>
{% endblock content %}
{% endraw %}
