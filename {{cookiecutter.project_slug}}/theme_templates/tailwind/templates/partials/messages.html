{% raw %}{% load i18n %}
{% if messages %}
  <div class="mb-6 space-y-3" aria-live="polite">
    {% for message in messages %}
      <div role="status"
           class="flex items-start justify-between gap-4 rounded-lg border px-4 py-3 {% if 'error' in message.tags %}border-red-200 bg-red-50 text-red-800{% elif 'success' in message.tags %}border-emerald-200 bg-emerald-50 text-emerald-800{% elif 'warning' in message.tags %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}">
        <span>{{ message }}</span>
        <button type="button"
                data-dismiss-message
                class="rounded px-1 font-semibold focus-visible:outline-2"
                aria-label="{% translate 'Dismiss message' %}">×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
{% endraw %}
